version: 0.1
cli:
  version: 1.25.0
lint:
  disabled:
    - terraform-validate
  enabled:
    - pinact@4.0.0
    - checkov@3.3.10
    - trufflehog@3.96.0
    - trivy@0.73.0
    - yamllint@1.38.0
    - semgrep@1.172.0
    - cspell@10.0.1
    - git-diff-check
    - actionlint@1.7.12
    - gitleaks@8.30.1
    - markdownlint@0.49.1
    - prettier@3.9.6
    - shellcheck@0.11.0
    - shfmt@3.13.1
actions:
  disabled:
    - commitizen
  enabled:
    - wip-check
    - templated-output-check
    - commitizen-prompt-conventional
    - commitizen-tools-check
    - commit-branch
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
plugins:
  sources:
    - id: aps831
      ref: v2.4.1
      uri: https://github.com/aps831/trunk-io-plugins
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - python@3.14.4
    - go@1.21.0
    - node@22.16.0
